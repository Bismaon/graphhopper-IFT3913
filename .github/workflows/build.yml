name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      # current mutation score
      - name: Run mutation coverage
        run: mvn test-compile org.pitest:pitest-maven:mutationCoverage -DfailWhenNoMutations=false
      - name: Extract mutation score
        run: |
          SCORE=$(grep -o '<div class="coverage_percentage">[^<]*' core/target/pit-reports/index.html \
          | sed -E 's/.*>([^<]*)/\1/' \
          | awk 'NR==2' \
          | tr -d '%')
          echo "Extracted score: $SCORE"
          echo "CURRENT_SCORE=$SCORE" >> $GITHUB_ENV

      # previous mutation score
      - name: Find last workflow run ID
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_RUN_ID=$(gh run list --workflow build.yml --json databaseId -q '.[1].databaseId')
          echo "LATEST_RUN_ID=$LATEST_RUN_ID" >> $GITHUB_ENV
          echo "Found run ID: $LATEST_RUN_ID"

      - name: Download previous mutation score (from last run)
        if: env.LATEST_RUN_ID != ''
        uses: actions/download-artifact@v5
        with:
          name: mutation-score-${{ matrix.java-version }}
          github-token: ${{ github.token }}
          run-id: ${{ env.LATEST_RUN_ID }}
        continue-on-error: true

      - name: Compare mutation score with previous
        run: |
          if [ -f previous_score.txt ]; then
            PREV_SCORE=$(cat previous_score.txt)
          else
            PREV_SCORE=0
          fi
          echo "Previous mutation score: $PREV_SCORE"
          echo "Current mutation score: $CURRENT_SCORE"
          if (( CURRENT_SCORE < PREV_SCORE )); then
            echo "Mutation score decreased ($PREV_SCORE → $CURRENT_SCORE)"
            exit 1
          else
            echo "Mutation score maintained or improved ($PREV_SCORE → $CURRENT_SCORE)"
          fi
      - name: Save current mutation score for next runs
        if: success()
        run: echo "$CURRENT_SCORE" > previous_score.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mutation-score-${{ matrix.java-version }}
          path: previous_score.txt
