name: Java CI with Maven

on: [pull_request]

# 1. PERMISSIONS: Required to allow the bot to comment on the PR
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # 2. THE TEST: If this fails, the workflow is marked as 'failure'
    - name: Run Maven Tests
      run: mvn -B test --file pom.xml

    # 3. THE RICKROLL: Only runs if the previous steps failed
    - name: Rickroll the failure
      if: failure() 
      # usage assumes the action code is in the root of this repo
      # If it's in a subfolder, use: ./path/to/action/folder
      uses: ./ 
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
